<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chat de bits</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #f2f2f0;
      color: #1d1d1b;
      font-family: system-ui, sans-serif;
    }
    main {
      max-width: 640px;
      margin: 40px auto;
      padding: 0 16px;
    }
    h1 { font-size: 1.4rem; margin-bottom: 4px; }
    .hint { color: #666; font-size: 0.9rem; margin-top: 0; }
    .messages {
      height: 320px;
      overflow-y: auto;
      padding: 12px;
      background: #fff;
      border: 1px solid #d5d5d0;
      border-radius: 6px;
      font-family: ui-monospace, monospace;
      font-size: 0.9rem;
    }
    .message { padding: 4px 0; }
    .sent { color: #1d1d1b; }
    .received { color: #1d3f6b; }
    .ok { color: #1d6b2f; }
    .error { color: #a32020; }
    .translation {
      margin-bottom: 12px;
      padding: 10px 12px;
      background: #fff;
      border: 1px solid #d5d5d0;
      border-radius: 6px;
      font-family: ui-monospace, monospace;
      font-size: 0.85rem;
    }
    .translation[hidden] { display: none; }
    .translation-row + .translation-row { margin-top: 8px; }
    .translation-label {
      display: block;
      color: #666;
      font-family: system-ui, sans-serif;
      font-size: 0.75rem;
      margin-bottom: 2px;
    }
    .translation-value {
      display: block;
      overflow-wrap: anywhere;
    }
    .frames {
      margin-top: 12px;
      padding: 10px 12px;
      background: #fff;
      border: 1px solid #d5d5d0;
      border-radius: 6px;
    }
    .frames[hidden] { display: none; }
    .frames-output {
      margin: 0;
      max-height: 220px;
      overflow: auto;
      font-family: ui-monospace, monospace;
      font-size: 0.8rem;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    form {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }
    select, input {
      padding: 10px;
      border: 1px solid #b8b8b2;
      border-radius: 6px;
      font: inherit;
      background: #fff;
    }
    input {
      flex: 1;
      min-width: 0;
    }
    button {
      padding: 10px 18px;
      border: 0;
      border-radius: 6px;
      background: #1d1d1b;
      color: #fff;
      font: inherit;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: wait; }
  </style>
</head>
<body>
  <main>
    <h1>Chat de bits</h1>
    <p class="hint">Escribe un mensaje en español. En modo bits, máximo 16 caracteres.</p>
    <p id="user-line" class="hint"></p>

    <section id="translation" class="translation" hidden>
      <div class="translation-row">
        <span class="translation-label">Español → ASCII</span>
        <code id="ascii-output" class="translation-value"></code>
      </div>
      <div class="translation-row">
        <span class="translation-label">ASCII → Binario</span>
        <code id="binary-output" class="translation-value"></code>
      </div>
    </section>

    <div id="messages" class="messages"></div>

    <section id="frames-panel" class="frames" hidden>
      <span class="translation-label">Tramas enviadas a la Beagle</span>
      <pre id="frames-output" class="frames-output"></pre>
    </section>

    <form id="send-form">
      <select id="mode" aria-label="Modo de envio">
        <option value="frames">Tramas PHY</option>
        <option value="bits">Bits sin trama</option>
        <option value="diagnostic">Tramas al LED (diagnóstico)</option>
      </select>
      <input id="text" type="text" autocomplete="off"
             maxlength="128" placeholder="Ej: hola" required>
      <button id="send" type="submit">Enviar</button>
    </form>
  </main>

  <script src="translator.js"></script>
  <script>
    (function () {
      var form = document.getElementById("send-form");
      var input = document.getElementById("text");
      var button = document.getElementById("send");
      var messages = document.getElementById("messages");
      var translation = document.getElementById("translation");
      var asciiOutput = document.getElementById("ascii-output");
      var binaryOutput = document.getElementById("binary-output");
      var modeSelect = document.getElementById("mode");
      var framesPanel = document.getElementById("frames-panel");
      var framesOutput = document.getElementById("frames-output");
      var userLine = document.getElementById("user-line");
      var inboxSince = 0;
      var username = (window.prompt("Tu nombre de usuario:", "ana") || "").trim();

      if (!username) {
        username = "ana";
      }
      username = username.replace(/\s+/g, "_");
      userLine.textContent = "Usuario: " + username;

      function addMessage(text, kind) {
        var item = document.createElement("div");
        item.className = "message " + kind;
        item.textContent = text;
        messages.appendChild(item);
        messages.scrollTop = messages.scrollHeight;
      }

      function setBusy(busy) {
        button.disabled = busy;
        input.disabled = busy;
        modeSelect.disabled = busy;
        button.textContent = busy ? "Enviando..." : "Enviar";
      }

      function errorText(data, fallback) {
        if (data && data.error) {
          return data.error;
        }
        if (data && data.response) {
          return data.response;
        }
        return fallback;
      }

      function sendMessage(text) {
        framesPanel.hidden = true;
        addMessage("Tu (" + username + "): " + text, "sent");
        setBusy(true);

        fetch("/api/message", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ user: username, text: text })
        })
          .then(function (response) {
            return response.json().then(function (data) {
              return { ok: response.ok, data: data };
            });
          })
          .then(function (result) {
            if (result.ok) {
              addMessage("Enviado al nodo A.", "ok");
            } else {
              addMessage("Error: " + errorText(result.data, "no se pudo enviar"),"error");
            }
          })
          .catch(function () {
            addMessage("Error: no se pudo contactar al servidor local.", "error");
          })
          .then(function () {
            setBusy(false);
            input.focus();
          });
      }

      function appendFrameLine(line) {
        framesOutput.textContent += line + "\n";
        framesOutput.scrollTop = framesOutput.scrollHeight;
      }

      function pollFrames(job, since) {
        fetch("/api/frames?job=" + encodeURIComponent(job) + "&since=" + since)
          .then(function (response) {
            return response.json().then(function (data) {
              return { ok: response.ok, data: data };
            });
          })
          .then(function (result) {
            if (!result.ok) {
              addMessage("Error: " + errorText(result.data, "trabajo no encontrado"), "error");
              setBusy(false);
              input.focus();
              return;
            }

            var data = result.data;
            if (data.lines && data.lines.length) {
              data.lines.forEach(appendFrameLine);
            }
            if (!data.done) {
              setTimeout(function () {
                pollFrames(job, data.next);
              }, 500);
              return;
            }

            addMessage(data.ok ? "Tramas enviadas a la Beagle." : "El emisor termino con error.",
                       data.ok ? "ok" : "error");
            setBusy(false);
            input.focus();
          })
          .catch(function () {
            addMessage("Error: se corto el polling de tramas.", "error");
            setBusy(false);
            input.focus();
          });
      }

      function sendFrames(text) {
        framesPanel.hidden = false;
        framesOutput.textContent = "";
        addMessage("Tu (" + username + "): " + text, "sent");
        addMessage("Enviando tramas al LED...", "sent");
        setBusy(true);

        fetch("/api/frames", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: text })
        })
          .then(function (response) {
            return response.json().then(function (data) {
              return { ok: response.ok, data: data };
            });
          })
          .then(function (result) {
            if (!result.ok || !result.data.job) {
              addMessage("Error: " + errorText(result.data, "no se pudo iniciar el envio"), "error");
              setBusy(false);
              input.focus();
              return;
            }
            pollFrames(result.data.job, 0);
          })
          .catch(function () {
            addMessage("Error: no se pudo contactar al servidor local.", "error");
            setBusy(false);
            input.focus();
          });
      }

      function sendBits(bits, text) {
        framesPanel.hidden = true;
        addMessage("Tu (" + username + "): " + text, "sent");
        addMessage("Binario: " + bits, "sent");
        setBusy(true);

        fetch("/api/bits", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ bits: bits })
        })
          .then(function (response) {
            return response.json().then(function (data) {
              return { ok: response.ok, data: data };
            });
          })
          .then(function (result) {
            if (result.ok) {
              addMessage("Nodo: " + (result.data.response || "OK"), "ok");
            } else {
              addMessage("Error: " + errorText(result.data, "fallo"), "error");
            }
          })
          .catch(function () {
            addMessage("Error: no se pudo contactar al servidor local.", "error");
          })
          .then(function () {
            setBusy(false);
            input.focus();
          });
      }

      function pollInbox() {
        fetch("/api/inbox?since=" + encodeURIComponent(inboxSince))
          .then(function (response) {
            return response.json().then(function (data) {
              return { ok: response.ok, data: data };
            });
          })
          .then(function (result) {
            if (!result.ok) {
              return;
            }
            var data = result.data;
            (data.messages || []).forEach(function (message) {
              var origin = message.source ? message.source + " · " : "";
              addMessage(origin + message.user + ": " + message.text, "received");
            });
            if (typeof data.next === "number") {
              inboxSince = data.next;
            }
          })
          .catch(function () {
          })
          .then(function () {
            setTimeout(pollInbox, 800);
          });
      }

      form.addEventListener("submit", function (event) {
        event.preventDefault();
        var text = input.value.trim();
        var translated = Translator.translate(text);

        if (translated.error) {
          addMessage(translated.error, "error");
          return;
        }

        asciiOutput.textContent = translated.asciiText;
        binaryOutput.textContent = translated.binaryGroups;
        translation.hidden = false;
        input.value = "";

        if (modeSelect.value === "frames") {
          sendMessage(text);
          return;
        }

        if (modeSelect.value === "diagnostic") {
          sendFrames(text);
          return;
        }

        if (translated.bitLength > 128) {
          addMessage("El mensaje supera los 128 bits (16 caracteres).", "error");
          return;
        }
        sendBits(translated.binary, text);
      });

      pollInbox();
    })();
  </script>
</body>
</html>
